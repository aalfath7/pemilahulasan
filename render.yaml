# Blueprint Render: New > Blueprint > pilih repo ini.
services:
  - type: web
    name: pemilah-ulasan
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # diisi manual di dashboard Render
      - key: DATABASE_URL
        sync: false # connection string dari Neon
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
